[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "nutanix-ztf"
version = "2.1.0"
description = "Nutanix multi-domain infrastructure automation framework"
authors = [
    { name = "ztf@nutanix.com" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["nutanix", "infrastructure-as-code", "iac", "prism-central", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "click>=8.0",
    "inflect>=7.5.0",
    "json5>=0.10.0",
    "certifi>=2026.7.22",
    "requests>=2.34.2",
    "urllib3>=2.6.3,<3",
    "ntnx-aiops-py-client==4.2.2b1",
    "ntnx-clustermgmt-py-client==4.2.2",
    "ntnx-datapolicies-py-client==4.2.2",
    "ntnx-dataprotection-py-client==4.3.1",
    "ntnx-iam-py-client==4.1.2b2",
    "ntnx-lifecycle-py-client==4.3.1",
    "ntnx-licensing-py-client==4.3.2",
    "ntnx-microseg-py-client==4.2.2",
    "ntnx-monitoring-py-client==4.2.2",
    "ntnx-multidomain-py-client==4.3.1",
    "ntnx-networking-py-client==4.3.1",
    "ntnx-objects-py-client==4.0.3",
    "ntnx-opsmgmt-py-client==4.0.4",
    "ntnx-prism-py-client==4.3.1",
    "ntnx-security-py-client==4.1.2",
    "ntnx-vmm-py-client==4.2.2",
    "ntnx-volumes-py-client==4.2.2",
    "pyyaml>=6.0.3",
    "orjson>=3.12.0",
    "paramiko>=4.0.0",
    "requests-cache>=1.3.1",
]

[project.scripts]
ztf = "ztf.main:cli"

[project.optional-dependencies]
dev = [
    "bandit>=1.9.4",
    "mypy>=1.10.0",
    "pre-commit>=3.0.0",
    "pytest>=8.4.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.1.0",
    "requests-cache>=1.3.1",
    "ruff>=0.4.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "twine>=7.0.0",
    "types-paramiko>=4.0.0.20260402",
    "types-pyyaml>=6.0.12.20250915",
    "types-requests>=2.31.0.6",
]

[project.urls]
Homepage = "https://github.com/nutanixdev/zerotouch-framework"
Repository = "https://github.com/nutanixdev/zerotouch-framework"
"User Guide" = "https://github.com/nutanixdev/zerotouch-framework/blob/main/docs/user-guide.md"
Changelog = "https://github.com/nutanixdev/zerotouch-framework/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/nutanixdev/zerotouch-framework/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ztf*"]

[tool.setuptools.package-data]
ztf = [
    "py.typed",
    "entity_wrapper/entity_catalog.json",
    "entity_wrapper/multi_namespace_compatibility_map.json",
    "entity_wrapper/multi_namespace_metadata_map.json",
    "entity_wrapper/registry_corrections.json",
]

[tool.uv]
# ntnx v4 SDK clients pin urllib3~=1.26 and certifi<=2025.4.26, which
# cannot take current HIGH-severity and CA-bundle fixes. The generated
# REST wrapper reads .headers rather than the urllib3 2.x-removed
# getheaders().
override-dependencies = [
    "urllib3>=2.6.3,<3",
    "certifi>=2026.7.22",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=1.10.0",
    "pre-commit>=3.0.0",
    "pytest>=8.4.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.1.0",
    "requests-cache>=1.3.1",
    "ruff>=0.4.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "twine>=7.0.0",
    "types-paramiko>=4.0.0.20260402",
    "types-pyyaml>=6.0.12.20250915",
    "types-requests>=2.31.0.6",
]

[tool.ruff]
line-length = 88
target-version = "py310"
# Markdown code-fence formatting was stabilized in ruff 0.16 and applies by
# default. Our docs contain illustrative snippets (partial functions, YAML
# fragments) that are intentionally not Black-formatted; excluding *.md keeps
# `ruff format` behavior stable across ruff versions instead of reformatting
# docs whenever ruff's Markdown formatter rules change upstream.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PIE", "RET", "SIM", "ARG", "PTH", "S"]
ignore = [
    "E501",    # line length — ruff format owns this; linter would conflict
    "ARG001",  # unused function argument — needed for callbacks and interface methods
    "ARG002",  # unused method argument — same reason
    "PTH",     # pathlib migration — os.path used throughout; enable when migrated
]
[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ARG005",  # lambda mock arguments are intentionally unused (test mock callbacks)
    "B017",    # pytest.raises(Exception) is acceptable in tests testing generic failure paths
    "N803",    # @patch injects MockClassName args — uppercase is standard convention
    "N806",    # same for local mock variables assigned from @patch context managers
    "SIM115",  # open() inside lambdas (monkeypatching) cannot use context managers
    "S",       # bandit security rules — not applicable to test code (S101 assert, etc.)
]
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--ignore=tests/functional -v --tb=short"
markers = [
    "functional: marks tests as functional (requires live infrastructure)",
    "slow: marks tests as slow",
    "namespace: marks tests with namespace context",
    "security: marks tests as security-related",
]

[tool.bandit]
exclude_dirs = ["tests"]
